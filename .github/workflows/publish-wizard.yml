name: Publish Wizard

on:
  push:
    tags:
      - 'wizard/v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build and Publish Wizard Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Extract Version
        id: vars
        run: |
          TAG_REF="${GITHUB_REF#refs/tags/}"
          VERSION=$(echo "$TAG_REF" | grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Binaries
        run: |
          mkdir -p build
          cd wizard
          GOOS=linux GOARCH=amd64 go build -o ../build/truesignal-linux-amd64 cmd/wizard/main.go
          GOOS=linux GOARCH=arm64 go build -o ../build/truesignal-linux-arm64 cmd/wizard/main.go
          
      - name: Generate Checksums
        run: |
          cd build
          sha256sum truesignal-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: "Wizard v${{ steps.vars.outputs.VERSION }}"
          files: |
            build/truesignal-linux-amd64
            build/truesignal-linux-arm64
            build/checksums.txt
          generate_release_notes: true
