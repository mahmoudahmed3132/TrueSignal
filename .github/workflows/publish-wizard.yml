name: Publish Wizard

on:
  push:
    tags:
      - 'wizard/v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build and Publish Wizard Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Extract Version
        id: vars
        run: |
          TAG_REF="${GITHUB_REF#refs/tags/}"
          VERSION=$(echo "$TAG_REF" | grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # The binary sends WizardVersion to the Hub; it must match the tag.
          CODE_VERSION=$(grep -oP 'WizardVersion\s*=\s*"\K[^"]+' wizard/core/api/client.go)
          if [ "$CODE_VERSION" != "$VERSION" ]; then
            echo "::error::Tag version $VERSION does not match WizardVersion $CODE_VERSION"
            exit 1
          fi

      - name: Refuse to re-release a published version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-uploading would replace the binaries under the same version and
          # break anyone who pinned their checksum. Bump WizardVersion instead.
          # Fails closed: a release with no assets (an earlier run that died
          # before uploading) may be completed; any API error stops the job.
          TAG="wizard/v${{ steps.vars.outputs.VERSION }}"
          CODE=$(curl -sS -o release.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")
          case "$CODE" in
            404) echo "No release for $TAG yet." ;;
            200)
              ASSETS=$(jq '.assets | length' release.json)
              if [ "$ASSETS" -gt 0 ]; then
                echo "::error::Release $TAG already has $ASSETS assets. Bump the version instead."
                exit 1
              fi ;;
            *) echo "::error::Could not check release $TAG (HTTP $CODE); refusing to publish."; exit 1 ;;
          esac
          rm -f release.json

      - name: Build Binaries
        run: |
          mkdir -p build
          cd wizard
          # Static binaries: the installer drops them on arbitrary distros.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../build/truesignal-linux-amd64 ./cmd/wizard
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../build/truesignal-linux-arm64 ./cmd/wizard
          
      - name: Generate Checksums
        run: |
          cd build
          sha256sum truesignal-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: "Wizard v${{ steps.vars.outputs.VERSION }}"
          files: |
            build/truesignal-linux-amd64
            build/truesignal-linux-arm64
            build/checksums.txt
          generate_release_notes: true
