name: Publish Wizard

on:
  push:
    tags:
      - 'wizard/v*.*.*'
  workflow_dispatch:

# Runs for the same tag (a tag push and a manual dispatch, or two
# dispatches) queue instead of overlapping, so the later one's
# re-release check sees what the first published. Different tags still
# run in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Releases go to the public distribution repository; this source repository
# is private. Must match the URLs compiled into the Hub (registry_url
# default, update check) and install.sh. DIST_REPO_TOKEN: fine-grained PAT,
# that repository only, Contents read/write (Docs/development/maintainer-workflow.md).
env:
  DIST_REPO: mahmoudahmed3132/truesignal-dist

permissions:
  contents: read
  packages: write
  # Sigstore keyless signing: the job's OIDC token gets a short-lived
  # signing certificate bound to this workflow and tag.
  id-token: write

jobs:
  publish:
    name: Build and Publish Wizard Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Check distribution repository credential
        env:
          DIST_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          if [ -z "$DIST_TOKEN" ]; then
            echo "::error::Secret DIST_REPO_TOKEN is not set; cannot publish to $DIST_REPO."
            exit 1
          fi

      - name: Extract Version
        id: vars
        run: |
          TAG_REF="${GITHUB_REF#refs/tags/}"
          VERSION=$(echo "$TAG_REF" | grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # The binary sends WizardVersion to the Hub; it must match the tag.
          CODE_VERSION=$(grep -oP 'WizardVersion\s*=\s*"\K[^"]+' wizard/core/api/client.go)
          if [ "$CODE_VERSION" != "$VERSION" ]; then
            echo "::error::Tag version $VERSION does not match WizardVersion $CODE_VERSION"
            exit 1
          fi

      - name: Refuse to re-release a published version
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          # Re-uploading would replace the binaries under the same version and
          # break anyone who pinned their checksum. Bump WizardVersion instead.
          # Fails closed: a release with no assets (an earlier run that died
          # before uploading) may be completed; any API error stops the job.
          TAG="wizard/v${{ steps.vars.outputs.VERSION }}"
          CODE=$(curl -sS -o release.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${DIST_REPO}/releases/tags/${TAG}")
          case "$CODE" in
            404) echo "No release for $TAG yet." ;;
            200)
              ASSETS=$(jq '.assets | length' release.json)
              if [ "$ASSETS" -gt 0 ]; then
                echo "::error::Release $TAG already has $ASSETS assets. Bump the version instead."
                exit 1
              fi ;;
            *) echo "::error::Could not check release $TAG (HTTP $CODE); refusing to publish."; exit 1 ;;
          esac
          rm -f release.json

      - name: Build Binaries
        run: |
          mkdir -p build
          cd wizard
          # Static binaries: the installer drops them on arbitrary distros.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../build/truesignal-linux-amd64 ./cmd/wizard
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../build/truesignal-linux-arm64 ./cmd/wizard
          
      - name: Generate Checksums
        run: |
          cd build
          sha256sum truesignal-* > checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'

      - name: Sign binaries and checksums (Sigstore keyless)
        run: |
          cd build
          for f in truesignal-linux-amd64 truesignal-linux-arm64 checksums.txt; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          VERSION: ${{ steps.vars.outputs.VERSION }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-wizard.yml@${{ github.ref }}
        run: |
          TAG="wizard/v$VERSION"
          cd build
          {
            echo "TrueSignal Wizard v$VERSION (linux amd64/arm64, static)."
            echo
            echo 'Install:'
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/$DIST_REPO/main/install.sh | bash -s -- --version v$VERSION"
            echo '```'
            echo
            echo 'SHA-256 (`checksums.txt`):'
            echo '```'
            cat checksums.txt
            echo '```'
            echo
            echo 'Verify the Sigstore signature:'
            echo '```'
            echo "cosign verify-blob --bundle truesignal-linux-amd64.sigstore.json \\"
            echo "  --certificate-identity $IDENTITY \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  truesignal-linux-amd64"
            echo '```'
          } > notes.md
          FILES="truesignal-linux-amd64 truesignal-linux-arm64 checksums.txt truesignal-linux-amd64.sigstore.json truesignal-linux-arm64.sigstore.json checksums.txt.sigstore.json"
          # The guard above let through only a missing release or one with no
          # assets (an earlier run that died before uploading).
          if gh release view "$TAG" --repo "$DIST_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --repo "$DIST_REPO"
          else
            gh release create "$TAG" $FILES --repo "$DIST_REPO" --target main \
              --title "Wizard v$VERSION" --notes-file notes.md
          fi
