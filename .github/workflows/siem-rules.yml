name: SIEM Rules

# Runs the Elastic detection rules (Docs/siem/elastic/) through a real
# Elasticsearch + Kibana detection engine against the Hub's emitted samples
# (Docs/siem/testdata/detection-samples.ndjson, kept current by the Go test
# TestSIEMDetectionSamples in the Tests workflow).

on:
  push:
    branches: [ "main" ]
    paths:
      - "Docs/siem/**"
      - "Docs/siem-integration.md"
      - "scripts/siem-rules/**"
      - ".github/workflows/siem-rules.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Docs/siem/**"
      - "Docs/siem-integration.md"
      - "scripts/siem-rules/**"
      - ".github/workflows/siem-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elastic:
    name: Elastic rules (ES + Kibana 8.19)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run rules against the sample corpus
        run: scripts/siem-rules/run-elastic.sh
