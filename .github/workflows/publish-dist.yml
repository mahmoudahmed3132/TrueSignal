name: Publish Distribution Repository

# This source repository is private. Everything nodes and Hubs download
# anonymously lives in the public distribution repository:
#   main            distribution/README.md, install.sh, LICENSE, NOTICE (synced from here)
#   registry-pages  sensor manifests + Sigstore bundles (publish-sensor-registry.yml)
#   releases        hub/v* and wizard/v* (publish-hub.yml, publish-wizard.yml)
#
# This workflow syncs main, and seeds registry-pages once from this
# repository's registry-pages branch (byte-for-byte, so the existing Sigstore
# bundles still verify). After that it never touches registry-pages.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'install.sh'
      - 'LICENSE'
      - 'NOTICE'
      - 'distribution/**'
      - '.github/workflows/publish-dist.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Must match the URLs compiled into the Hub (registry_url default, update
# check) and install.sh. DIST_REPO_TOKEN: fine-grained PAT, that repository
# only, Contents read/write (Docs/development/maintainer-workflow.md).
env:
  DIST_REPO: mahmoudahmed3132/truesignal-dist

permissions:
  contents: read

jobs:
  sync:
    name: Sync distribution repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check distribution repository credential
        env:
          DIST_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          if [ -z "$DIST_TOKEN" ]; then
            echo "::error::Secret DIST_REPO_TOKEN is not set; cannot publish to $DIST_REPO."
            exit 1
          fi

      - name: Prepare distribution clone
        env:
          DIST_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          # A separate repository outside the workspace, so the source
          # checkout's GITHUB_TOKEN header is not sent to DIST_REPO.
          D="$RUNNER_TEMP/dist"
          git init -q "$D"
          cd "$D"
          AUTH=$(printf 'x-access-token:%s' "$DIST_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git remote add origin "https://github.com/$DIST_REPO.git"
          git config user.name "TrueSignal CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "DIST_DIR=$D" >> "$GITHUB_ENV"

      - name: Sync main
        run: |
          SRC="$GITHUB_WORKSPACE"
          cd "$DIST_DIR"
          # Fails closed: only "no such branch" (exit 2) starts a new one.
          set +e
          git ls-remote --exit-code --heads origin main >/dev/null
          RC=$?
          set -e
          case "$RC" in
            0) git fetch -q origin main && git checkout -q -B main FETCH_HEAD ;;
            2) git checkout -q --orphan main ;;
            *) echo "::error::Cannot reach $DIST_REPO (git exit $RC)."; exit 1 ;;
          esac
          git rm -q -rf --ignore-unmatch . >/dev/null
          git clean -q -fdx
          cp -a "$SRC/distribution/." .
          cp "$SRC/install.sh" "$SRC/LICENSE" "$SRC/NOTICE" .
          git add -A
          if git diff --cached --quiet; then
            echo "main is up to date."
            exit 0
          fi
          git commit -q -m "dist: sync from source ${GITHUB_SHA::12}"
          git push -q origin HEAD:main
          echo "Pushed main."

      - name: Seed registry-pages (once)
        run: |
          set +e
          (cd "$DIST_DIR" && git ls-remote --exit-code --heads origin registry-pages >/dev/null)
          RC=$?
          set -e
          case "$RC" in
            0) echo "registry-pages already exists in $DIST_REPO; not touching it."; exit 0 ;;
            2) ;;
            *) echo "::error::Cannot reach $DIST_REPO (git exit $RC)."; exit 1 ;;
          esac
          git fetch -q --depth=1 origin registry-pages
          SEED=$(git rev-parse FETCH_HEAD)
          WORK="$RUNNER_TEMP/registry"
          mkdir -p "$WORK"
          git archive FETCH_HEAD | tar -x -C "$WORK"
          cd "$DIST_DIR"
          git checkout -q --orphan registry-pages
          git rm -q -rf --ignore-unmatch . >/dev/null
          git clean -q -fdx
          cp -a "$WORK/." .
          git add -A
          git commit -q -m "registry: seed from source registry-pages ${SEED::12}"
          # Byte-for-byte copy: every file must match the source tree.
          [ "$(git rev-parse HEAD^{tree})" = "$(git -C "$GITHUB_WORKSPACE" rev-parse "$SEED^{tree}")" ] \
            || { echo "::error::Seeded tree differs from the source registry-pages."; exit 1; }
          git push -q origin HEAD:registry-pages
          echo "Seeded registry-pages from $SEED."
