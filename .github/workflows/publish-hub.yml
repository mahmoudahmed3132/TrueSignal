name: Publish Hub

on:
  push:
    tags:
      - 'hub/v*.*.*'
  workflow_dispatch:

# Runs for the same tag (a tag push and a manual dispatch, or two
# dispatches) queue instead of overlapping, so the later one's
# re-release check sees what the first published. Different tags still
# run in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Releases go to the public distribution repository; this source repository
# is private. Must match the URLs compiled into the Hub (registry_url
# default, update check) and install.sh. DIST_REPO_TOKEN: fine-grained PAT,
# that repository only, Contents read/write (Docs/development/maintainer-workflow.md).
env:
  DIST_REPO: mahmoudahmed3132/truesignal-dist

permissions:
  contents: read
  packages: write
  # Sigstore keyless signing: the job's OIDC token gets a short-lived
  # signing certificate bound to this workflow and tag.
  id-token: write

jobs:
  publish:
    name: Build and Push Hub Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check distribution repository credential
        env:
          DIST_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          if [ -z "$DIST_TOKEN" ]; then
            echo "::error::Secret DIST_REPO_TOKEN is not set; cannot publish to $DIST_REPO."
            exit 1
          fi

      - name: Extract Version
        id: vars
        run: |
          TAG_REF="${GITHUB_REF#refs/tags/}"
          VERSION=$(echo "$TAG_REF" | grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # The binary reports HubVersion; it must match the tag.
          CODE_VERSION=$(grep -oP 'HubVersion\s*=\s*"\K[^"]+' Hub/internal/models/models.go)
          if [ "$CODE_VERSION" != "$VERSION" ]; then
            echo "::error::Tag version $VERSION does not match HubVersion $CODE_VERSION"
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Refuse to re-release a published version
        run: |
          # Rebuilding would move the image tag to a new digest under the
          # same version. Bump HubVersion instead. Asks the registry directly
          # and fails closed: only a 404 lets the build proceed.
          REPO="${{ github.repository_owner }}/truesignal-hub"
          TAG="v${{ steps.vars.outputs.VERSION }}"
          TOKEN=$(curl -fsS -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r .token)
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${REPO}/manifests/${TAG}")
          case "$CODE" in
            404) echo "ghcr.io/${REPO}:${TAG} not published yet." ;;
            200) echo "::error::ghcr.io/${REPO}:${TAG} is already published. Bump the version instead."; exit 1 ;;
            *)   echo "::error::Could not check ghcr.io/${REPO}:${TAG} (HTTP $CODE); refusing to publish."; exit 1 ;;
          esac

      - name: Build and Push Hub Docker Image
        id: image
        run: |
          VERSION="${{ steps.vars.outputs.VERSION }}"
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/truesignal-hub:v$VERSION"
          LATEST_TAG="ghcr.io/${{ github.repository_owner }}/truesignal-hub:latest"
          
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            -f Hub/Dockerfile Hub/
          docker push "$IMAGE_TAG" | tee push_out.log
          docker push "$LATEST_TAG"
          DIGEST=$(grep -o 'sha256:[a-f0-9]\{64\}' push_out.log | tail -n 1)
          [ -n "$DIGEST" ] || { echo "::error::no digest in push output"; exit 1; }
          echo "DIGEST=$DIGEST" >> $GITHUB_OUTPUT
          # Keyless signature by digest (verify with cosign verify, see
          # Docs/operations.md section 13).
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/truesignal-hub@$DIGEST"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          VERSION: ${{ steps.vars.outputs.VERSION }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/truesignal-hub
          DIGEST: ${{ steps.image.outputs.DIGEST }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-hub.yml@${{ github.ref }}
        run: |
          # The Hub's update check reads hub/v* releases from DIST_REPO.
          TAG="hub/v$VERSION"
          if gh release view "$TAG" --repo "$DIST_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists in $DIST_REPO."
            exit 0
          fi
          {
            echo "TrueSignal Hub v$VERSION."
            echo
            echo 'Image (pin the digest in production):'
            echo '```'
            echo "$IMAGE:v$VERSION"
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo
            echo 'Verify the Sigstore signature:'
            echo '```'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-identity $IDENTITY \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } > notes.md
          gh release create "$TAG" --repo "$DIST_REPO" --target main \
            --title "Hub v$VERSION" --notes-file notes.md
