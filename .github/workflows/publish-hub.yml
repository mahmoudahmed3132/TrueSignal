name: Publish Hub

on:
  push:
    tags:
      - 'hub/v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build and Push Hub Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Extract Version
        id: vars
        run: |
          TAG_REF="${GITHUB_REF#refs/tags/}"
          VERSION=$(echo "$TAG_REF" | grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # The binary reports HubVersion; it must match the tag.
          CODE_VERSION=$(grep -oP 'HubVersion\s*=\s*"\K[^"]+' Hub/internal/models/models.go)
          if [ "$CODE_VERSION" != "$VERSION" ]; then
            echo "::error::Tag version $VERSION does not match HubVersion $CODE_VERSION"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Refuse to re-release a published version
        run: |
          # Rebuilding would move the image tag to a new digest under the
          # same version. Bump HubVersion instead. Asks the registry directly
          # and fails closed: only a 404 lets the build proceed.
          REPO="${{ github.repository_owner }}/truesignal-hub"
          TAG="v${{ steps.vars.outputs.VERSION }}"
          TOKEN=$(curl -fsS -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r .token)
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${REPO}/manifests/${TAG}")
          case "$CODE" in
            404) echo "ghcr.io/${REPO}:${TAG} not published yet." ;;
            200) echo "::error::ghcr.io/${REPO}:${TAG} is already published. Bump the version instead."; exit 1 ;;
            *)   echo "::error::Could not check ghcr.io/${REPO}:${TAG} (HTTP $CODE); refusing to publish."; exit 1 ;;
          esac

      - name: Build and Push Hub Docker Image
        run: |
          VERSION="${{ steps.vars.outputs.VERSION }}"
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/truesignal-hub:v$VERSION"
          LATEST_TAG="ghcr.io/${{ github.repository_owner }}/truesignal-hub:latest"
          
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            -f Hub/Dockerfile Hub/
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: "Hub v${{ steps.vars.outputs.VERSION }}"
          generate_release_notes: true
