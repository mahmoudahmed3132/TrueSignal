name: Publish Sensor to Registry

on:
  push:
    tags:
      - 'sensor/**/v*.*.*'
  workflow_dispatch:

# Runs for the same tag (a tag push and a manual dispatch, or two
# dispatches) queue instead of overlapping, so the later one's
# re-release check sees what the first published. Different tags still
# run in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  # Sigstore keyless signing: the job's OIDC token gets a short-lived
  # signing certificate bound to this workflow and tag.
  id-token: write

jobs:
  publish:
    name: "📦 Publish Sensor Manifest"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Extract sensor name and version from tag
        id: vars
        run: |
          TAG_REF="${GITHUB_REF#refs/tags/}"
          SENSOR_NAME=$(echo "$TAG_REF" | sed 's|^sensor/||' | sed 's|/v[0-9].*$||')
          VERSION=$(echo "$TAG_REF" | grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+')

          if [ -z "$SENSOR_NAME" ] || [ -z "$VERSION" ]; then
            exit 1
          fi

          echo "SENSOR_NAME=$SENSOR_NAME" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate source manifest
        id: validate
        run: |
          EXPECTED_ID="ts-sensor-${{ steps.vars.outputs.SENSOR_NAME }}"
          SOURCE=$(find Sensors/official -name "*.json" | while read file; do
              ID=$(jq -r '.id // empty' "$file" 2>/dev/null || true)
              if [ "$ID" = "$EXPECTED_ID" ]; then
                  echo "$file"
                  exit 0
              fi
          done)

          if [ -z "$SOURCE" ]; then
            exit 1
          fi
          echo "SOURCE=$SOURCE" >> $GITHUB_OUTPUT

          # The tag must release exactly what the manifest in the repo says.
          MANIFEST_VERSION=$(jq -r '.version' "$SOURCE")
          if [ "$MANIFEST_VERSION" != "${{ steps.vars.outputs.VERSION }}" ]; then
            echo "::error::Tag version ${{ steps.vars.outputs.VERSION }} does not match $SOURCE version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Refuse to re-release a published version
        run: |
          # Rebuilding would move the image tag and orphan the digest the
          # published manifest pins (the GHCR cleanup deletes untagged images).
          FILE="${{ steps.vars.outputs.SENSOR_NAME }}-v${{ steps.vars.outputs.VERSION }}.json"
          if git ls-remote --exit-code --heads origin registry-pages >/dev/null 2>&1; then
            git fetch -q origin registry-pages
            if git cat-file -e "FETCH_HEAD:$FILE" 2>/dev/null; then
              echo "::error::$FILE is already published. Bump the version instead."
              exit 1
            fi
          fi

      - name: Build versioned manifest
        id: build
        run: |
          SOURCE="${{ steps.validate.outputs.SOURCE }}"
          SENSOR_NAME="${{ steps.vars.outputs.SENSOR_NAME }}"
          VERSION="${{ steps.vars.outputs.VERSION }}"
          OUTPUT_FILE="${SENSOR_NAME}-v${VERSION}.json"

          jq --arg ver "$VERSION" --arg tag "v$VERSION" \
             '.version = $ver |
              .deployment.image_tag = $tag |
              if .deployment.init_containers then
                .deployment.init_containers = [
                  .deployment.init_containers[] | .image_tag = $tag
                ]
              else . end' \
             "$SOURCE" > "/tmp/$OUTPUT_FILE"

          echo "OUTPUT_FILE=$OUTPUT_FILE" >> $GITHUB_OUTPUT

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push Docker Image
        id: image
        run: |
          SOURCE="${{ steps.validate.outputs.SOURCE }}"
          SENSOR_DIR=$(dirname "$SOURCE")
          VERSION="${{ steps.vars.outputs.VERSION }}"
          
          IMAGE_REPO=$(jq -r '.deployment.image_repository // empty' "$SOURCE")
          if [ -z "$IMAGE_REPO" ]; then
             exit 0
          fi

          IMAGE_TAG="$IMAGE_REPO:v$VERSION"
          LATEST_TAG="$IMAGE_REPO:latest"
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            -f "$SENSOR_DIR/Dockerfile" .
          docker push "$IMAGE_TAG" | tee push_out.log
          docker push "$LATEST_TAG"
          
          DIGEST=$(grep -o 'sha256:[a-f0-9]\{64\}' push_out.log | tail -n 1)
          if [ -n "$DIGEST" ]; then
             OUTPUT_FILE="${{ steps.build.outputs.OUTPUT_FILE }}"
             jq --arg digest "$DIGEST" '.deployment.image_digest = $digest | if .deployment.init_containers then .deployment.init_containers[].image_digest = $digest else . end' "/tmp/$OUTPUT_FILE" > "/tmp/$OUTPUT_FILE.tmp" && mv "/tmp/$OUTPUT_FILE.tmp" "/tmp/$OUTPUT_FILE"
             echo "REF=$IMAGE_REPO@$DIGEST" >> $GITHUB_OUTPUT
          else
             exit 1
          fi

      - name: Sign manifest and image (Sigstore keyless)
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-sensor-registry.yml@${{ github.ref }}
        run: |
          MANIFEST="/tmp/${{ steps.build.outputs.OUTPUT_FILE }}"
          # The Hub verifies this bundle and pins IDENTITY (repo, this
          # workflow, this sensor's tag) before it uses the manifest.
          cosign sign-blob --yes --bundle "$MANIFEST.sigstore.json" "$MANIFEST"
          cosign verify-blob --bundle "$MANIFEST.sigstore.json" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$MANIFEST"
          # The manifest pins the image digest, so the Hub needs no image
          # signature; it lets anyone (or admission control) check the image.
          if [ -n "${{ steps.image.outputs.REF }}" ]; then
            cosign sign --yes "${{ steps.image.outputs.REF }}"
          fi

      - name: Publish manifest to registry-pages
        run: |
          git config user.name "TrueSignal CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Retries on a rejected push: sensor tags pushed together run as
          # parallel jobs writing the same branch (see the script header).
          # Run from /tmp: the script checks registry-pages out over this tree.
          cp scripts/publish-registry.sh scripts/build-registry-index.sh /tmp/
          REGISTRY_INDEX_SCRIPT=/tmp/build-registry-index.sh bash /tmp/publish-registry.sh "/tmp/${{ steps.build.outputs.OUTPUT_FILE }}" \
            "registry: publish ${{ steps.vars.outputs.SENSOR_NAME }} v${{ steps.vars.outputs.VERSION }}" \
            "/tmp/${{ steps.build.outputs.OUTPUT_FILE }}.sigstore.json"
