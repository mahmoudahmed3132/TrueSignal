name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: go test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - Hub
          - wizard
          - SDKs/go-truesignal
          - Sensors/official/DatabaseDecoy
          - Sensors/official/FileCanary
          - Sensors/official/IcmpCanary
          - Sensors/official/IdentityDecoy
          - Sensors/official/NetworkScanDetector
          - Sensors/official/NetworkServiceDecoy
          - Sensors/official/RemoteAccessDecoy
          - Sensors/official/TcpTarpit
          - Sensors/official/TokenReceiver
          - Sensors/official/WebRouterDecoy
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # The Hub embeds the compiled UI (go:embed), so it must exist before
      # the api and ui packages compile.
      - name: Setup Node
        if: matrix.module == 'Hub'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Hub/ui/package-lock.json

      - name: Build UI
        if: matrix.module == 'Hub'
        working-directory: Hub/ui
        run: |
          npm ci
          npm run build

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  # Builds every image the release workflows publish, so a Dockerfile that
  # no longer matches its package (e.g. building ./main.go when the package
  # has more files) fails on the PR instead of at release time.
  docker:
    name: docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - Hub
          - DatabaseDecoy
          - FileCanary
          - IcmpCanary
          - IdentityDecoy
          - NetworkScanDetector
          - NetworkServiceDecoy
          - RemoteAccessDecoy
          - TcpTarpit
          - TokenReceiver
          - WebRouterDecoy
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build
        run: |
          if [ "${{ matrix.image }}" = "Hub" ]; then
            docker build -f Hub/Dockerfile Hub/
          else
            docker build -f "Sensors/official/${{ matrix.image }}/Dockerfile" .
          fi

  # The TLS overlay pins the proxy's address; this brings the Hub compose
  # plus the overlay up (with stand-in images, so it needs no cert or
  # build) and fails if the two services cannot both get their addresses.
  compose-tls-overlay:
    name: compose TLS overlay starts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Production compose never builds from source
        working-directory: Hub
        # A build section next to image: lets a failed pull silently run a
        # local build under a release tag. Builds live in docker-compose.build.yml.
        run: |
          if docker compose -f docker-compose.yml -f docker-compose.tls.yml config --format json | jq -e '.services[] | select(has("build"))' >/dev/null; then
            echo "::error::Hub/docker-compose.yml (or the TLS overlay) has a build section"; exit 1
          fi

      - name: Bring up base + TLS overlay
        working-directory: Hub
        run: |
          cat > /tmp/standin.yml <<'YAML'
          services:
            permission-fixer:
              image: alpine:3.22
            truesignal-hub:
              image: alpine:3.22
              build: !reset null
              command: ["sleep", "120"]
              user: "0:0"
            tls-proxy:
              image: alpine:3.22
              command: ["sleep", "120"]
              user: "0:0"
          YAML
          files="-f docker-compose.yml -f docker-compose.tls.yml -f /tmp/standin.yml"
          docker compose -p tlsci $files up -d
          test "$(docker inspect -f '{{.State.Running}}' truesignal-tls-proxy)" = true
          test "$(docker inspect -f '{{.State.Running}}' truesignal-hub)" = true
          docker compose -p tlsci $files down -v

  python:
    name: Python SDK / mock hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Byte-compile
        run: python -m compileall -q SDKs/python-truesignal Sensors/templates/python-sensor scripts
