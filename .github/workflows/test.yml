name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: go test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - Hub
          - wizard
          - SDKs/go-truesignal
          - Sensors/official/DatabaseDecoy
          - Sensors/official/FileCanary
          - Sensors/official/IcmpCanary
          - Sensors/official/IdentityDecoy
          - Sensors/official/NetworkScanDetector
          - Sensors/official/NetworkServiceDecoy
          - Sensors/official/RemoteAccessDecoy
          - Sensors/official/TcpTarpit
          - Sensors/official/TokenReceiver
          - Sensors/official/WebRouterDecoy
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # The Hub embeds the compiled UI (go:embed), so it must exist before
      # the api and ui packages compile.
      - name: Setup Node
        if: matrix.module == 'Hub'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Hub/ui/package-lock.json

      - name: Build UI
        if: matrix.module == 'Hub'
        working-directory: Hub/ui
        run: |
          npm ci
          npm run build

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  # Builds every image the release workflows publish, so a Dockerfile that
  # no longer matches its package (e.g. building ./main.go when the package
  # has more files) fails on the PR instead of at release time.
  docker:
    name: docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - Hub
          - DatabaseDecoy
          - FileCanary
          - IcmpCanary
          - IdentityDecoy
          - NetworkScanDetector
          - NetworkServiceDecoy
          - RemoteAccessDecoy
          - TcpTarpit
          - TokenReceiver
          - WebRouterDecoy
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build
        run: |
          if [ "${{ matrix.image }}" = "Hub" ]; then
            docker build -f Hub/Dockerfile Hub/
          else
            docker build -f "Sensors/official/${{ matrix.image }}/Dockerfile" .
          fi

  python:
    name: Python SDK / mock hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Byte-compile
        run: python -m compileall -q SDKs/python-truesignal Sensors/templates/python-sensor scripts
