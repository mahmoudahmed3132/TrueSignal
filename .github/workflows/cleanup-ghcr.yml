name: Prune Untagged Docker Images

on:
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

jobs:
  clean-ghcr:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # List all your packages here
        package: 
          - truesignal-hub
          - truesignal-tcptarpit
          - truesignal-networkscandetector
          - truesignal-icmpcanary
          - truesignal-webrouterdecoy
          - truesignal-filecanary
          - truesignal-identitydecoy
          - truesignal-databasedecoy
          - truesignal-remoteaccessdecoy
          - truesignal-networkservicedecoy
          - truesignal-tokenreceiver
    steps:
      - name: Delete untagged versions for ${{ matrix.package }}
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: '${{ matrix.package }}'
          package-type: 'container'
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 1 # Keeps 'latest' and '1.0.0' safe
          token: ${{ secrets.DELETE_PACKAGES_TOKEN }}