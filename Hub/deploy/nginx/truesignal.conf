# TLS front end for the TrueSignal Hub (used by docker-compose.tls.yml).
# The Hub serves plain HTTP on 8080 and trusts forwarding headers only from
# this proxy (TS_TRUST_PROXY + TS_TRUSTED_PROXIES). The headers below are SET,
# never appended, so a client cannot smuggle its own X-Real-IP or
# X-Forwarded-For through to the Hub.
#
# Certificate and key: ./deploy/tls/hub.crt and hub.key (mounted read-only).

upstream truesignal_hub {
    server truesignal-hub:8080;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/hub.crt;
    ssl_certificate_key /etc/nginx/tls/hub.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The Hub caps UI bodies at 1 MiB and sensor bodies at 256 KiB.
    client_max_body_size 1m;

    proxy_http_version 1.1;

    # The forwarding headers are repeated in each location on purpose: nginx
    # drops every server-level proxy_set_header in a location that sets any
    # of its own, and the client's X-Real-IP would then reach the Hub.

    # Dashboard live feed. The Hub pings every 20 s, so 60 s of silence
    # means the client is gone.
    location = /api/v2/ws {
        proxy_pass         http://truesignal_hub;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    location / {
        proxy_pass         http://truesignal_hub;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
    }
}
