# TLS overlay: puts nginx in front of the Hub and stops publishing the Hub's
# plain-HTTP port. Requires Docker Compose 2.24+ (!reset).
#
#   mkdir -p deploy/tls && cp <cert> deploy/tls/hub.crt && cp <key> deploy/tls/hub.key
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# The proxy gets a fixed address so TS_TRUSTED_PROXIES names exactly it. If
# 172.30.80.0/29 clashes with your networks, set TS_PROXY_SUBNET and
# TS_PROXY_IP (an address inside the subnet) in .env.
services:
  truesignal-hub:
    ports: !reset []
    environment:
      - TS_TRUST_PROXY=true
      - TS_TRUSTED_PROXIES=${TS_PROXY_IP:-172.30.80.2}
    networks:
      - hub

  tls-proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    container_name: truesignal-tls-proxy
    restart: unless-stopped
    depends_on:
      - truesignal-hub
    ports:
      - "${TS_HTTPS_PORT:-443}:8443"
      - "${TS_HTTP_PORT:-80}:8080"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    volumes:
      - ./deploy/nginx/truesignal.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    networks:
      hub:
        ipv4_address: ${TS_PROXY_IP:-172.30.80.2}

networks:
  hub:
    ipam:
      config:
        - subnet: ${TS_PROXY_SUBNET:-172.30.80.0/29}
