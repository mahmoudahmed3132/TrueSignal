services:
  # 1. THE FIXER: Runs as root, fixes permissions, and dies instantly.
  permission-fixer:
    image: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    # 65532 is the standard UID/GID for the Distroless nonroot user
    command: sh -c "chown -R 65532:65532 /data"
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./truesignal_data:/data

  # 2. THE HUB: Pure Go distroless backend and UI.
  truesignal-hub:
    # Pin a release in production, e.g. TS_HUB_VERSION=v2.1.0
    image: ghcr.io/mahmoudahmed3132/truesignal-hub:${TS_HUB_VERSION:-latest}
    container_name: truesignal-hub
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    
    ports:
      # Host port is configurable; the Hub always listens on 8080 inside.
      - "${TS_PORT:-8080}:8080"
      
    # --- SECURITY SANDBOX ---
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # ------------------------

    volumes:
      # The database volume remains writable, while the container OS is read-only
      - ./truesignal_data:/data
      
    depends_on:
      # This ensures the Hub waits until the fixer is completely finished
      permission-fixer:
        condition: service_completed_successfully
        
    environment:
      - TS_PORT=8080
      - TS_DB_PATH=/data/truesignal.db
      # Read-only GitHub token for the private sensor registry and release
      # check (Docs/operations.md §10). Set it in the host env or .env.
      - TS_GITHUB_TOKEN=${TS_GITHUB_TOKEN:-}
